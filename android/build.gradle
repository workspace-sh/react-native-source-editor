apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'com.facebook.react'

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

android {
  namespace 'sh.workspace.sourceeditor'
  // Sora-Editor 0.24.x requires minSdk 24; matches the RN 0.81 template.
  compileSdkVersion safeExtGet('compileSdkVersion', 35)
  buildToolsVersion safeExtGet('buildToolsVersion', '35.0.0')

  defaultConfig {
    minSdkVersion safeExtGet('minSdkVersion', 24)
    targetSdkVersion safeExtGet('targetSdkVersion', 35)
  }

  buildFeatures {
    buildConfig true
  }

  // Sora-Editor's language-textmate uses Java APIs not available below
  // API 26 (java.time, etc.). Core library desugaring polyfills them.
  compileOptions {
    coreLibraryDesugaringEnabled true
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  lintOptions {
    abortOnError false
  }
}

dependencies {
  // RN's gradle plugin manages the version. `react-android` is the modern
  // artifact name (RN 0.71+); old `react-native` coordinate is deprecated.
  implementation 'com.facebook.react:react-android'

  // Sora-Editor by Rosemoe — the Android STTextView-analog.
  // LGPL-2.1, consumed dynamically as a Gradle `implementation` AAR (no
  // source modification, no static linking) so consumers inherit MIT.
  // See README for the license boundary note.
  //
  // Maven Central tops out at 0.23.x — GitHub Releases tagged 0.24.x are
  // pre-release builds not published there. Stick with the latest Maven
  // Central release.
  implementation 'io.github.Rosemoe.sora-editor:editor:0.23.6'
  // TextMate grammar engine — VS Code-style .tmLanguage.json grammars
  // bundled as Android assets under src/main/assets/textmate/.
  implementation 'io.github.Rosemoe.sora-editor:language-textmate:0.23.6'
  // Polyfills java.time etc. that language-textmate's Joni regex engine
  // needs on minSdk < 26.
  coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}
